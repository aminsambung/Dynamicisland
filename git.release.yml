name: Release Dynamic Island

on:
  push:
    tags:
      - 'v*'  # trigger saat push tag seperti v1.0.0

permissions:
  contents: write

jobs:
  release:
    name: 🚀 Create Release
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: ☕ Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🐘 Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: 🔑 Grant gradlew permission
        run: chmod +x ./gradlew

      - name: 🔨 Build Release APK
        run: ./gradlew assembleRelease

      # Rename APK dengan versi tag
      - name: 🏷️ Rename APK
        run: |
          mkdir -p release-artifacts
          cp app/build/outputs/apk/release/*.apk \
             release-artifacts/dynamic-island-${{ github.ref_name }}.apk

      # Bikin GitHub Release + upload APK
      - name: 📦 Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-artifacts/*.apk
          name: Dynamic Island ${{ github.ref_name }}
          body: |
            ## 🌴 Dynamic Island ${{ github.ref_name }}

            ### ✨ Fitur
            - 📞 Incoming Call style (iPhone 14 Pro)
            - 🎵 Now Playing mode
            - 🌊 Smooth morphing animation
            - 🎨 4 mode: Idle / Music / Call Ringing / Call Active

            ### 📥 Install
            1. Download APK di bawah
            2. Aktifkan **"Install from unknown sources"**
            3. Install & buka
            4. Beri izin **Overlay**
            5. Aktifkan service → tekan simulasi panggilan

            ### ⚠️ Catatan
            APK ini unsigned. Untuk release ke Play Store perlu signing key.
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}